name: Validação do capítulo 03

on:
  push:
    branches:
      - main
      - "pratica/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      etapa:
        description: Etapa que deve ser validada
        required: true
        type: choice
        options:
          - "01"
          - "02"

permissions:
  contents: read

concurrency:
  group: cap03-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Selecionar a etapa
        id: etapa
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          ETAPA_MANUAL: ${{ inputs.etapa }}
          BRANCH_PR: ${{ github.head_ref }}
        run: |
          if [[ "${EVENTO}" == "workflow_dispatch" ]]; then
            echo "numero=${ETAPA_MANUAL}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          branch="${GITHUB_REF_NAME}"
          if [[ "${EVENTO}" == "pull_request" ]]; then
            branch="${BRANCH_PR}"
          fi

          case "${branch}" in
            main) echo "numero=estrutura" >> "${GITHUB_OUTPUT}" ;;
            pratica/01-primeiros-objetos) echo "numero=01" >> "${GITHUB_OUTPUT}" ;;
            pratica/02-extensao-unidade) echo "numero=02" >> "${GITHUB_OUTPUT}" ;;
            *)
              echo "::error title=Nome de branch inválido::Use uma branch indicada no README."
              exit 1
              ;;
          esac

      - name: Compilar com avisos habilitados
        run: make build

      - name: Executar testes cumulativos
        if: steps.etapa.outputs.numero != 'estrutura'
        run: make test ETAPA=${{ steps.etapa.outputs.numero }}
